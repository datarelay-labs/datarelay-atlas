# Preparation-only workflow: never performs a production code or env switch.
# The SHA-pinned canonical release contract enforces main-ref authorization,
# self-hosted runner group and immutable candidate ancestry before execution.
name: Atlas Protected Release Boundary Qualification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact 40-character main-ancestry candidate commit SHA"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: atlas-protected-release-boundary
  cancel-in-progress: false

jobs:
  bounded-qualification:
    # Defense in depth: canonical reusable workflow independently checks
    # protected default-branch dispatch and candidate SHA ancestry.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected == true
    uses: datarelay-labs/engineering-system/.github/workflows/release-contract.yml@e85d6a4de7e7df2dcbcf4f5dd43269bb308de195
    with:
      expected_sha: ${{ inputs.expected_sha }}
      phase: qualify
      profile_path: .engineering/release.yaml
