name: Engineering System

on:
  pull_request:
  pull_request_target:

permissions:
  contents: read

jobs:
  governance-floor:
    if: github.event_name == 'pull_request_target'
    uses: datarelay-labs/engineering-system/.github/workflows/governance-floor.yml@e85d6a4de7e7df2dcbcf4f5dd43269bb308de195
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}

  adoption-compliance:
    if: github.event_name == 'pull_request'
    uses: datarelay-labs/engineering-system/.github/workflows/adoption-compliance.yml@e85d6a4de7e7df2dcbcf4f5dd43269bb308de195

  enforcement-reconcile:
    if: github.event_name == 'pull_request'
    uses: datarelay-labs/engineering-system/.github/workflows/enforcement-check.yml@e85d6a4de7e7df2dcbcf4f5dd43269bb308de195

  affected-tests:
    if: github.event_name == 'pull_request'
    uses: datarelay-labs/engineering-system/.github/workflows/affected-tests.yml@e85d6a4de7e7df2dcbcf4f5dd43269bb308de195
    with:
      manifest_path: .engineering/tests.yaml
      trigger: pr
