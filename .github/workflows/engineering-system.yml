name: Engineering System

on:
  pull_request:
  pull_request_target:

permissions:
  contents: read

jobs:
  governance-floor:
    if: github.event_name == 'pull_request_target'
    uses: datarelay-labs/engineering-system/.github/workflows/governance-floor.yml@be3c44c421738c1510cca0e9e2fd076279db0f63
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}

  adoption-compliance:
    if: github.event_name == 'pull_request'
    uses: datarelay-labs/engineering-system/.github/workflows/adoption-compliance.yml@be3c44c421738c1510cca0e9e2fd076279db0f63

  enforcement-reconcile:
    if: github.event_name == 'pull_request'
    uses: datarelay-labs/engineering-system/.github/workflows/enforcement-check.yml@be3c44c421738c1510cca0e9e2fd076279db0f63

  affected-tests:
    if: github.event_name == 'pull_request'
    uses: datarelay-labs/engineering-system/.github/workflows/affected-tests.yml@be3c44c421738c1510cca0e9e2fd076279db0f63
    with:
      manifest_path: .engineering/tests.yaml
      trigger: pr
