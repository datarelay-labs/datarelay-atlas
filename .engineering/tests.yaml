version: 1
setup_command: "python3 -m pip install --quiet -r requirements.txt"

paths:
  "AGENTS.md":
    domains: [methodology]
  ".engineering/**":
    domains: [methodology]
  ".github/**":
    domains: [methodology]
  ".cursor/**":
    domains: [methodology]
  "docs/product/**":
    domains: [product-docs]
  "docs/architecture/**":
    domains: [knowledge, integrations]
  "docs/roadmap/**":
    domains: [lifecycle, product-docs]
  "docs/decisions/**":
    domains: [knowledge, integrations]
  "docs/contracts/**":
    domains: [knowledge, integrations, project-registry]
  "docs/migration/**":
    domains: [knowledge, integrations]
  "integrations/athena/**":
    domains: [integrations]
  "atlas/**":
    domains: [knowledge, integrations, project-registry, ai-context]
  "tests/**":
    domains: [knowledge, integrations, project-registry, ai-context, methodology]
  "scripts/**":
    domains: [methodology, integrations]
  "THIRD_PARTY.md":
    domains: [integrations]
  "README.md":
    domains: [product-docs]
  "README.ko.md":
    domains: [product-docs]

scenarios:
  - id: ATLAS-STATIC-001
    name: Git whitespace validation
    level: static
    domains: [methodology, project-registry, lifecycle, knowledge, ai-context, integrations, product-docs]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "git diff --check"
    invariants:
      - "repository text and metadata remain free of whitespace errors"
    release_gate: true

  - id: ATLAS-CONTRACT-001
    name: Source provider provenance contract fixture validation
    level: static
    domains: [knowledge, integrations, project-registry]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 scripts/validate-source-provider-provenance.py"
    invariants:
      - "accepted source/provider/provenance fixture validates against the published schema"
      - "example provenance payloads remain non-canonical and credential-free"
    release_gate: true

  - id: ATLAS-UNIT-001
    name: Atlas-owned absorption unit tests
    level: unit
    domains: [knowledge, integrations, project-registry, ai-context]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 -m unittest discover -s tests -v"
    invariants:
      - "GitHub sync/provenance projection regressions pass"
      - "Phase 1 project registry/adoption/sync/rebuild regressions pass"
      - "hybrid retrieval fusion regressions pass"
      - "projection-to-keyword retrieval and operator search CLI regressions pass"
      - "external embedding semantic retrieval and hybrid RRF regressions pass"
      - "MCP context scope and provenance regressions pass"
      - "authenticated MCP resource-server and HTTPS smoke regressions pass"
      - "non-root service config fails closed and health exposes no canonical data"
      - "quiesced data-root backup includes controller state, skips chat-audit cache, and rejects corrupt, partial, secret, and unsupported state"
      - "upgrade and rollback refuse unsupported durable schemas and completion events without rewriting them, and rollback executes the staged target code"
      - "the production operations profile points at quiesced backup, restore-test, upgrade, and staged-target rollback commands"
      - "the prod-atlas launch contract names the host, public MCP URL, and required TCP 443 ingress without claiming the host is up"
      - "the qualification harness fails closed without prod inputs and does not claim production from the local journey"
      - "prod qualification syncs only the charter, requires a changed service identity, and binds Cursor evidence to the checkout HEAD"
      - "Autonomous Work Controller PoC control-loop regressions pass"
      - "Queued Work Packet cycle-chaining regressions pass"
      - "Continuous Chat Audit Supervisor PoC checkpoint/slice regressions pass"
      - "Dependency/readiness multi-node E2E proves deterministic independent selection, conflict serialization, gate preservation, one max_wip=1 activation/dispatch lifecycle, and replay fail-closed behavior"
      - "Cursor usage Phase 0 inventory classifies workers without retaining prompts and summarizes usage CSV fixtures"
      - "context-canary intake strictly preserves measured comparable optimizer facts while remaining OBSERVE_ONLY with quality/security/runtime gates UNKNOWN"
      - "context-shadow quality binding may advance only quality_noninferiority to SHADOW_ACTION_EQUIVALENT on v2 repository/task/head/profile/run-set digest identity plus control-consistent action counts; active control, egress, and runtime gates remain blocked/UNKNOWN"
      - "learned-canary binding accepts only internally consistent Engineering System admission evidence; raw file/CLI input cannot mint CANARY_READY trust, and local-canary egress/runtime states require an exact producer-head/report-digest in-process coordinator boundary while active control stays blocked"
      - "provider capability descriptors are EVIDENCE_ONLY; Codex CLI, OpenAI Responses, and generic AuditPort CODE_REVIEW paths normalize the same AuditResult semantics without provider selection or execution authority"
      - "provider capacity broker planning is deterministic and fail-closed; denied/unknown gates or unusable capacity cannot become eligible, advisory selection grants no provider execution authority, and failover transition planning can only replan already-eligible routes or return HUMAN_REQUIRED"
      - "approved provider route configuration is CONFIGURATION_ONLY; candidate binding requires exact configured provider/runtime/usage-mode/adapter identity, all dynamically SUPPORTED capabilities to be config-approved, the requested capability to be allowed and supported, provider-matched capacity evidence, and preserves Atlas-owned dynamic gate states unchanged"
      - "dependency/readiness graph planning is deterministic, fail-closed, resource/WIP gated, and read-only"
      - "single-effect authorization requires max_wip=1, stable double GitHub reconciliation, exactly one selected node, and remains read-only"
      - "authorized readiness activation reauthorizes at the effect boundary and CAS-transitions only trusted PAUSED+QUEUED packets to ACTIVE+NONE without dispatch"
      - "single-worker readiness dispatch rechecks canonical ACTIVE identity and delegates exactly once to the existing exact-head persistent dispatcher without automatic retry"
    release_gate: true

  - id: ATLAS-INDEPENDENCE-001
    name: Athena repository independence gate
    level: static
    domains: [integrations, methodology, knowledge]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 scripts/validate-athena-independence.py"
    invariants:
      - "Atlas build/test paths do not require datarelay-labs/athena"
      - "public provenance schema does not expose Wiki.js identity fields"
    release_gate: true
