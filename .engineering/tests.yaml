version: 1
setup_command: "python3 -m pip install --quiet -r requirements.txt"

paths:
  "AGENTS.md":
    domains: [methodology]
  ".engineering/**":
    domains: [methodology]
  ".github/**":
    domains: [methodology]
  ".cursor/**":
    domains: [methodology]
  "docs/product/**":
    domains: [product-docs]
  "docs/architecture/**":
    domains: [knowledge, integrations]
  "docs/roadmap/**":
    domains: [lifecycle, product-docs]
  "docs/decisions/**":
    domains: [knowledge, integrations]
  "docs/contracts/**":
    domains: [knowledge, integrations, project-registry]
  "docs/migration/**":
    domains: [knowledge, integrations]
  "integrations/athena/**":
    domains: [integrations]
  "atlas/**":
    domains: [knowledge, integrations, project-registry, ai-context]
  "tests/**":
    domains: [knowledge, integrations, project-registry, ai-context, methodology]
  "scripts/**":
    domains: [methodology, integrations]
  "THIRD_PARTY.md":
    domains: [integrations]
  "README.md":
    domains: [product-docs]
  "README.ko.md":
    domains: [product-docs]

scenarios:
  - id: ATLAS-STATIC-001
    name: Git whitespace validation
    level: static
    domains: [methodology, project-registry, lifecycle, knowledge, ai-context, integrations, product-docs]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "git diff --check"
    invariants:
      - "repository text and metadata remain free of whitespace errors"
    release_gate: true

  - id: ATLAS-CONTRACT-001
    name: Source provider provenance contract fixture validation
    level: static
    domains: [knowledge, integrations, project-registry]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 scripts/validate-source-provider-provenance.py"
    invariants:
      - "accepted source/provider/provenance fixture validates against the published schema"
      - "example provenance payloads remain non-canonical and credential-free"
    release_gate: true

  - id: ATLAS-UNIT-001
    name: Atlas-owned absorption unit tests
    level: unit
    domains: [knowledge, integrations, project-registry, ai-context]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 -m unittest discover -s tests -v"
    invariants:
      - "GitHub sync/provenance projection regressions pass"
      - "Phase 1 project registry/adoption/sync/rebuild regressions pass"
      - "hybrid retrieval fusion regressions pass"
      - "projection-to-keyword retrieval and operator search CLI regressions pass"
      - "external embedding semantic retrieval and hybrid RRF regressions pass"
      - "MCP context scope and provenance regressions pass"
      - "authenticated MCP resource-server and HTTPS smoke regressions pass"
      - "non-root service config fails closed and health exposes no canonical data"
      - "quiesced data-root backup includes controller state, skips chat-audit cache, and rejects corrupt, partial, secret, and unsupported state"
      - "upgrade and rollback refuse unsupported durable schemas without rewriting them"
      - "Autonomous Work Controller PoC control-loop regressions pass"
      - "Queued Work Packet cycle-chaining regressions pass"
      - "Continuous Chat Audit Supervisor PoC checkpoint/slice regressions pass"
    release_gate: true

  - id: ATLAS-INDEPENDENCE-001
    name: Athena repository independence gate
    level: static
    domains: [integrations, methodology, knowledge]
    triggers: [affected, pr, preflight, release]
    platforms: [linux]
    command: "python3 scripts/validate-athena-independence.py"
    invariants:
      - "Atlas build/test paths do not require datarelay-labs/athena"
      - "public provenance schema does not expose Wiki.js identity fields"
    release_gate: true
